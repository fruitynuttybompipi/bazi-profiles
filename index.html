奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。","{xx.lou}":"娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。","{xx.vei}":"胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。","{xx.mao}":"昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。","{xx.bi}":"毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。","{xx.zi}":"觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。","{xx.can}":"参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。","{xx.jing}":"井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。","{xx.gui}":"鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。","{xx.liu}":"柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。","{xx.xing}":"星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。","{xx.zhang}":"张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。","{xx.yi}":"翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。","{xx.zhen}":"轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。"},ZHENG:{"{xx.jiao}":"{wx.mu}","{xx.jing}":"{wx.mu}","{xx.kui}":"{wx.mu}","{xx.dou}":"{wx.mu}","{xx.kang}":"{wx.jin}","{xx.gui}":"{wx.jin}","{xx.lou}":"{wx.jin}","{xx.niu}":"{wx.jin}","{xx.di}":"{wx.tu}","{xx.liu}":"{wx.tu}","{xx.vei}":"{wx.tu}","{xx.nv}":"{wx.tu}","{xx.fang}":"{wx.ri}","{xx.xing}":"{wx.ri}","{xx.mao}":"{wx.ri}","{xx.xu}":"{wx.ri}","{xx.xin}":"{wx.yue}","{xx.zhang}":"{wx.yue}","{xx.bi}":"{wx.yue}","{xx.wei}":"{wx.yue}","{xx.tail}":"{wx.huo}","{xx.yi}":"{wx.huo}","{xx.zi}":"{wx.huo}","{xx.shi}":"{wx.huo}","{xx.ji}":"{wx.shui}","{xx.zhen}":"{wx.shui}","{xx.can}":"{wx.shui}","{xx.qiang}":"{wx.shui}"},ANIMAL:{"{xx.jiao}":"{dw.jiao}","{xx.dou}":"{dw.xie}","{xx.kui}":"{dw.lang}","{xx.jing}":"{dw.han}","{xx.kang}":"{dw.long}","{xx.niu}":"{dw.niu}","{xx.lou}":"{dw.gou}","{xx.gui}":"{dw.yang}","{xx.nv}":"{dw.fu}","{xx.di}":"{dw.he}","{xx.vei}":"{dw.zhi}","{xx.liu}":"{dw.zhang}","{xx.fang}":"{dw.tu} <div class="wrap">
  <header class="topbar">
    <div class="titlerow">
      <h1>BaZi Profiles <span class="zh">八字</span></h1>
      <button class="sync btn small" id="syncBadge" type="button" title="Sync status"><span class="dot" id="syncDot"></span><svg class="ic ic-sync" aria-hidden="true"><use href="#i-sync"></use></svg><span id="syncText">This device only</span></button>
    </div>
    <nav class="tabs appnav" role="tablist" aria-label="Sections">
      <button role="tab" id="navList" aria-selected="true"><svg class="ic" aria-hidden="true"><use href="#i-people"></use></svg><span class="tl">People</span><span class="zh tz">名册</span></button>
      <button role="tab" id="navToday" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-today"></use></svg><span class="tl">This month</span><span class="zh tz">本月</span></button>
      <button role="tab" id="navCompare" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-venn"></use></svg><span class="tl">Compare</span><span class="zh tz">合盘</span></button>
      <button role="tab" id="navAsk" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-sparkle"></use></svg><span class="tl">Ask</span><span class="zh tz">问一问</span></button>
      <button role="tab" id="navSettings" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-sliders"></use></svg><span class="tl">Settings</span><span class="zh tz">设置</span></button>
    </nav>
    <div id="storageWarn" class="note" hidden>This browser is blocking storage, so profiles will be lost when you close the page. Export a backup before leaving, or turn on GitHub sync.</div>
  </header>

  <!-- ============ PROFILE LIST ============ -->
  <main id="vList" style="display:grid;gap:18px">
    <section class="card" id="todayCard" aria-labelledby="tcH" hidden>
      <header><h2 id="tcH"><svg class="ic" aria-hidden="true"><use href="#i-today"></use></svg>Today <span class="zh">今日</span></h2><span class="muted small" id="tcDate"></span></header>
      <div class="tclist" id="tcList"></div>
      <p class="muted small">From each person's chart and today's day pillar. A guide for planning, not a promise. Tap a person for their chart.</p>
    </section>
    <section class="card" aria-labelledby="listH">
      <header><h2 id="listH"><svg class="ic" aria-hidden="true"><use href="#i-people"></use></svg>People</h2><button class="btn accent small" type="button" data-act="add"><svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg>Add a person</button></header>
      <div class="search" id="searchBox" hidden><svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg><input id="search" type="search" placeholder="Search by nickname or notes" aria-label="Search people"></div>
      <div class="list" id="plist"></div>
    </section>
    <section class="card">
      <details>
        <summary>New to BaZi? The basics</summary>
        <dl class="gloss">
          <dt>Four pillars <span class="zh">四柱 · 八字</span></dt><dd>Your birth year, month, day and hour, each written as a pair of characters. Eight characters in all.</dd>
          <dt>Stems and branches <span class="zh">天干 · 地支</span></dt><dd>Ten stems (甲 乙 丙 丁 戊 己 庚 辛 壬 癸) sit on top; twelve branches (子 丑 寅 卯 辰 巳 午 未 申 酉 戌 亥), one per animal, sit below.</dd>
          <dt>Day Master <span class="zh">日主</span></dt><dd>The top character of the day pillar. It stands for you; the rest of the chart is read in relation to it.</dd>
          <dt>Five elements <span class="zh">五行</span></dt><dd>Wood, Fire, Earth, Metal, Water. Each feeds the next (木生火) and controls another (水克火).</dd>
          <dt>Ten gods <span class="zh">十神</span></dt><dd>Names for how each character relates to you: Peers 比劫 are your own element, Output 食伤 is what you produce, Wealth 财 is what you control, Officer 官杀 is what controls you, Resource 印 is what feeds you.</dd>
          <dt>Strength and useful elements <span class="zh">旺衰 · 喜用神</span></dt><dd>A strong Day Master benefits from elements that use its energy; a weak one benefits from elements that add to it.</dd>
          <dt>Solar terms <span class="zh">节气</span></dt><dd>BaZi months start on solar terms (around the 4th to 8th of each Western month). The year starts at Start of Spring 立春, around 4 February.</dd>
          <dt>Luck pillars <span class="zh">大运 · 流年</span></dt><dd>Ten-year periods that colour each stage of life. The pillar for the current year is 流年.</dd>
        </dl>
      </details>
    </section>
  </main>

  <!-- ============ THIS MONTH ============ -->
  <main id="vToday" hidden style="display:grid;gap:18px">
    <section class="card" aria-labelledby="tdH">
      <header><h2 id="tdH"><svg class="ic" aria-hidden="true"><use href="#i-today"></use></svg>Today <span class="zh">今日</span></h2><span class="muted small" id="tdDate"></span></header>
      <div class="today-head" id="tdHead"></div>
    </section>
    <section class="card" aria-labelledby="tmH">
      <header><h2 id="tmH"><svg class="ic" aria-hidden="true"><use href="#i-people"></use></svg>This month for my people</h2></header>
      <p class="muted small">Who has something to watch this solar month and this year. People with more to watch come first. Tap a person to open their chart.</p>
      <div class="list" id="tmList"></div>
    </section>
    <section class="card" aria-labelledby="accAllH">
      <header><h2 id="accAllH"><svg class="ic" aria-hidden="true"><use href="#i-target"></use></svg>How well the readings fit</h2><span class="muted small">All people</span></header>
      <p class="muted small">Built from the events you tick for past years in each person's Year planner. The more years you review, the more this tells you about which rules work for you.</p>
      <div id="accAll"></div>
    </section>
  </main>

  <!-- ============ ADD / EDIT ============ -->
  <main id="vEdit" hidden style="display:grid;gap:18px">
    <button class="back" type="button" data-act="cancelEdit"><svg class="ic" aria-hidden="true"><use href="#i-back"></use></svg>Back</button>
    <section class="card" aria-labelledby="editH">
      <h2 id="editH">Add a person</h2>
      <form id="ef" autocomplete="off">
        <label for="nick">Nickname <span class="muted small" style="font-weight:400">(not a full name)</span><input id="nick" required maxlength="30" placeholder="e.g. Mum, Ah Boy, Boss K"></label>
        <div style="display:grid;gap:6px"><span style="font-size:.9rem;font-weight:600">Birthday is in the</span>
          <div class="seg" role="group" aria-label="Calendar of the birthday"><button type="button" data-act="calWest" id="calWest" aria-pressed="true">Western calendar</button><button type="button" data-act="calLunar" id="calLunar" aria-pressed="false">Chinese lunar 农历</button></div></div>
        <label for="date" id="dateWrap">Date of birth<input id="date" type="date" required min="1901-01-01" max="2099-12-31"></label>
        <div id="lunarWrap" hidden style="display:grid;gap:8px">
          <div class="row2" style="grid-template-columns:1fr 1fr 1fr">
            <label for="lY">Lunar year<input id="lY" type="number" min="1901" max="2099" inputmode="numeric" placeholder="1952"></label>
            <label for="lM">Month<select id="lM"></select></label>
            <label for="lD">Day<select id="lD"></select></label>
          </div>
          <label class="tick" for="lLeap"><input id="lLeap" type="checkbox"> Leap month 闰月</label>
        </div>
        <p class="small" id="dateEcho" style="margin:-6px 0 0"></p>
        <div class="row2">
          <label for="time">Time of birth<input id="time" type="time"></label>
          <label for="gender">Gender<select id="gender"><option value="M">Male</option><option value="F">Female</option></select></label>
        </div>
        <label class="tick" for="unknown"><input id="unknown" type="checkbox"> I don't know the birth time</label>
        <label for="place">Place of birth<select id="place"></select></label>
        <div id="customPlace" class="row2" hidden>
          <label for="zone">Time zone<input id="zone" placeholder="Area/City, e.g. Asia/Kuala_Lumpur"></label>
          <label for="lon">Longitude °E<input id="lon" type="number" step="0.01" placeholder="101.69"></label>
        </div>
        <label for="notes">Notes <span class="muted small" style="font-weight:400">(optional)</span><textarea id="notes" maxlength="2000" placeholder="Anything you want to remember"></textarea></label>
        <div class="tip"><b>Enter the birth date and time exactly as shown on the birth certificate</b> (the ordinary Western calendar, local clock time where the person was born). If someone only knows their Chinese lunar birthday 农历生日, switch to the lunar calendar above and the app converts it. The app converts it for you, using the Chinese solar calendar (节气) that BaZi is based on.</div>
        <div id="editErr" class="status err" hidden></div>
        <button type="submit" class="primary" id="saveBtn" style="display:inline-flex;justify-content:center;gap:8px"><svg class="ic" aria-hidden="true"><use href="#i-check"></use></svg><span id="saveLbl">Save</span></button>
      </form>
      <div id="delZone" hidden style="display:grid;gap:10px">
        <button class="btn danger" type="button" data-act="askDelete"><svg class="ic" aria-hidden="true"><use href="#i-trash"></use></svg>Delete this person</button>
        <div class="confirm" id="delConfirm" hidden>
          <p>Delete <b id="delName"></b>? This removes the profile from every synced device.</p>
          <div class="btnrow"><button class="btn danger solid" type="button" data-act="doDelete">Delete</button><button class="btn" type="button" data-act="noDelete">Keep</button></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ ONE PROFILE ============ -->
  <main id="vProfile" hidden style="display:grid;gap:18px">
    <div class="btnrow" style="justify-content:space-between;align-items:center">
      <button class="back" type="button" data-act="toList"><svg class="ic" aria-hidden="true"><use href="#i-back"></use></svg>All people</button>
      <div class="btnrow"><button class="btn small" type="button" data-act="report"><svg class="ic" aria-hidden="true"><use href="#i-doc"></use></svg>Report</button><button class="btn small" type="button" data-act="yearAhead"><svg class="ic" aria-hidden="true"><use href="#i-calendar"></use></svg>Year ahead</button><button class="btn small" type="button" data-act="compareThis"><svg class="ic" aria-hidden="true"><use href="#i-venn"></use></svg>Compare</button><button class="btn small" type="button" data-act="editThis"><svg class="ic" aria-hidden="true"><use href="#i-edit"></use></svg>Edit</button></div>
    </div>
    <nav class="jumpbar" id="jump" aria-label="Jump to a section"></nav>
    <section class="card" aria-label="Day Master">
      <div class="you" id="you"></div>
      <details class="conf" id="conf"></details>
      <div id="notes1" style="display:grid;gap:6px"></div>
    </section>

    <section class="card" aria-labelledby="pH">
      <h2 id="pH"><svg class="ic" aria-hidden="true"><use href="#i-pillars"></use></svg>Four pillars <span class="zh">四柱八字</span></h2>
      <div class="pillars" id="pillars"></div>
      <p class="muted small">Tap any character to learn about it.</p>
      <div id="cellInfo" class="info" hidden></div>
      <details>
        <summary>Hidden stems 藏干, ten gods 十神 and branch roles</summary>
        <div class="dgrid" id="detail"></div>
        <p class="muted small">Root 通根 means the branch holds your own element, which strengthens you. Nayin 纳音 is the traditional "sound element" of each pillar, a symbolic texture rather than a strength measure.</p>
      </details>
      <details>
        <summary>Ten gods ranked 十神强弱</summary>
        <div class="gblegend small"><span><i></i>Birth chart</span><span><i class="y"></i><span id="gbYear"></span></span></div>
        <div class="gbars" id="godBars"></div>
        <p class="muted small">The app's own count: stems 1, hidden stems 1 / 0.5 / 0.3, and the month branch counts double. Bars are relative to the largest value. The top one is your strongest influence; it is not the same thing as your chart pattern.</p>
      </details>
      <details>
        <summary>Chart details 命盘资料</summary>
        <div class="dcard" id="facts"></div>
        <p class="small" id="fetal"></p>
      </details>
      <details>
        <summary>Life stages 十二长生</summary>
        <p class="muted small">How your Day Master fares in each branch, on the classical 12-stage cycle from Birth 长生 to Nurture 养. Green stages are strong, red are weak.</p>
        <div class="stages" id="stages"></div>
      </details>
    </section>
    <section class="card" aria-labelledby="hfH" id="hourCard" hidden>
      <header><h2 id="hfH"><svg class="ic" aria-hidden="true"><use href="#i-clock"></use></svg>Find the birth hour</h2><span id="estBadge"></span></header>
      <p class="muted small">The birth time is unknown, so here are all 12 possible hour pillars. Read the traits and later-life themes, compare them with what you know about this person, and pick the closest. The choice is saved as an estimate and can be changed any time.</p>
      <div class="hours" id="hours"></div>
    </section>

    <section class="card" aria-labelledby="sH">
      <header><h2 id="sH"><svg class="ic" aria-hidden="true"><use href="#i-scale"></use></svg>Day Master <span class="zh">日主</span></h2></header>
      <div id="sHead"></div>
      <div id="tug"></div>
      <h3 style="font-size:.95rem">The three classic checks</h3>
      <ol class="checks" id="checks"></ol>
      <div class="tip" id="sMeaning"></div>
      <div class="tip" id="sPattern"></div>
      <h3 style="font-size:.95rem">What helps you, and how to use it</h3>
      <div class="usegrid" id="useTips"></div>
      <div class="chips" id="unfav"></div>
      <ul class="reasons" id="usefulReasons"></ul>
      <details><summary>How the verdict is worked out</summary>
        <ul class="reasons" id="strReasons"></ul>
        <p class="muted small" id="sMethod"></p>
      </details>
    </section>

    <div id="cards" style="display:grid;gap:18px"></div>

    <section class="card" aria-labelledby="iH">
      <header><h2 id="iH"><svg class="ic" aria-hidden="true"><use href="#i-link"></use></svg>Interactions in the chart <span class="zh">刑冲合害</span></h2></header>
      <p class="muted small">Green lines are harmonies, red lines are tensions. Each one links two parts of your life: year = family and social life, month = career, day = you and your relationship, hour = children and later life.</p>
      <ul class="reasons" id="inter"></ul>
    </section>

    <section class="card" aria-labelledby="eH">
      <h2 id="eH"><svg class="ic" aria-hidden="true"><use href="#i-cycle"></use></svg>Five elements <span class="zh">五行生克</span></h2>
      <p class="muted small">Your own element is marked YOU. Every other element plays one role for you: it feeds you, you feed it, you control it, or it controls you. Solid arrows feed (生), dashed arrows control (克). Tap an element to see what it means for you, how much of it you have, and whether it helps.</p>
      <div class="wheel" id="wheel"></div>
      <div id="wheelInfo" class="info" hidden></div>
      <h3 style="font-size:.95rem;margin-top:4px">How much of each</h3>
      <div class="bars" id="bars"></div>
    </section>
    <section class="card plan" aria-labelledby="planH">
      <h2 id="planH"><svg class="ic" aria-hidden="true"><use href="#i-target"></use></svg>Your action plan <span class="zh">行动指南</span></h2>
      <div id="plan"></div>

        <details>
          <summary>How to set up sync (once)</summary>
          <ol class="steps">
            <li>On GitHub, create a new <b>private</b> repository, for example <code>bazi-data</code>. Leave it empty.</li>
            <li>Go to Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token.</li>

            <li>Paste your username, repo name and token here, then tap Connect. Do the same on each device.</li>
          </ol>
